<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 뷰어 테스트 — 정자동 우성아파트</title>
<meta name="robots" content="noindex">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #f5f5f7; }
  #topbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #eef0f5; font-size: 14px; font-weight: 700; color: #111; flex-shrink: 0; }
  #main { flex: 1; display: flex; min-height: 0; }
  model-viewer { flex: 1; height: 100%; background: #eee; }
  #panel { width: 300px; height: 100%; overflow-y: auto; background: #fff; border-left: 1px solid #e5e5ec; padding: 14px; flex-shrink: 0; }
  #panel h3 { font-size: 13px; margin: 0 0 12px; color: #999; font-weight: 700; }
  .mat-row { border: 1px solid #eef0f5; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .mat-name { font-size: 12px; color: #666; margin-bottom: 8px; word-break: break-all; display:flex; align-items:center; gap:6px; }
  .mat-swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #ddd; flex-shrink:0; }
  .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .preset-btn { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; background-size: cover; }
  .preset-btn.active { border-color: #5084ff; }
  .preset-btn:hover { border-color: #aaa; }
  @media (max-width: 700px) {
    #main { flex-direction: column; }
    #panel { width: 100%; height: 40%; border-left: none; border-top: 1px solid #eef0f5; }
    model-viewer { height: 60%; }
  }
</style>
</head>
<body>
<div id="topbar">3D 뷰어 테스트 — 정자동 우성아파트 (재질 편집 프로토타입)</div>
<div id="main">
  <model-viewer id="mv" src="assets/models/jeongja-woosung.glb" camera-controls shadow-intensity="1" exposure="1"></model-viewer>
  <div id="panel">
    <h3>재질 편집 (유사 재질로 교체)</h3>
    <div id="mat-list">로딩 중…</div>
  </div>
</div>
<script type="module">
const mv = document.getElementById('mv');

function makeCanvas(draw) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  draw(ctx, c.width, c.height);
  return c.toDataURL('image/png');
}

function woodTexture(base, dark, streaks) {
  return makeCanvas((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < streaks; i++) {
      const x = (i / streaks) * w + (Math.random() - 0.5) * 10;
      ctx.strokeStyle = dark;
      ctx.globalAlpha = 0.15 + Math.random() * 0.2;
      ctx.lineWidth = 2 + Math.random() * 4;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      let cx = x;
      for (let y = 0; y <= h; y += 20) { cx += (Math.random() - 0.5) * 14; ctx.lineTo(cx, y); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}
function plankFloorTexture(base, dark) {
  return makeCanvas((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const plankH = 64;
    for (let y = 0; y < h; y += plankH) {
      const offset = (y / plankH) % 2 === 0 ? 0 : w / 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      for (let x = -offset; x < w; x += w / 3) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + plankH); ctx.stroke();
      }
      for (let i = 0; i < 8; i++) {
        const gx = Math.random() * w, gy = y + Math.random() * plankH;
        ctx.strokeStyle = dark; ctx.globalAlpha = 0.12;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + w / 3, gy + (Math.random() - 0.5) * 6); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  });
}
function brushedMetalTexture() {
  return makeCanvas((ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#b8bcc2'); grad.addColorStop(0.5, '#e8eaed'); grad.addColorStop(1, '#b0b4ba');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 2) {
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
  });
}
function stuccoTexture(base) {
  return makeCanvas((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 20;
      img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
    }
    ctx.putImageData(img, 0, 0);
  });
}
function fabricTexture(base) {
  return makeCanvas((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    for (let x = 0; x < w; x += 4) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  });
}

const PRESETS = [
  { id: 'white',   label: '화이트 무광',   swatch: '#f5f5f2', type: 'color', color: [0.96, 0.96, 0.94, 1], roughness: 0.9, metalness: 0.0 },
  { id: 'black',   label: '블랙 글로시',   swatch: '#1a1a1a', type: 'color', color: [0.06, 0.06, 0.06, 1], roughness: 0.2, metalness: 0.1 },
  { id: 'grey',    label: '라이트 그레이', swatch: '#c9cad0', type: 'color', color: [0.79, 0.79, 0.82, 1], roughness: 0.8, metalness: 0.0 },
  { id: 'oak',     label: '연한 오크',     type: 'texture', gen: () => woodTexture('#e8d3ae', '#b8874f', 40), roughness: 0.7, metalness: 0.0 },
  { id: 'walnut',  label: '월넛 다크우드', type: 'texture', gen: () => woodTexture('#5a3a24', '#2c1a0f', 45), roughness: 0.6, metalness: 0.0 },
  { id: 'floor',   label: '오크 마루',     type: 'texture', gen: () => plankFloorTexture('#8a6440', '#4a3120'), roughness: 0.75, metalness: 0.0 },
  { id: 'steel',   label: '브러시드 스틸', type: 'texture', gen: () => brushedMetalTexture(), roughness: 0.35, metalness: 0.85 },
  { id: 'stucco',  label: '스타코/플라스터', type: 'texture', gen: () => stuccoTexture('#e9e7e2'), roughness: 0.95, metalness: 0.0 },
  { id: 'fabric',  label: '패브릭',        type: 'texture', gen: () => fabricTexture('#d8d2c6'), roughness: 0.9, metalness: 0.0 },
];

const _presetThumbCache = {};
function presetThumb(p) {
  if (p.type === 'color') return p.swatch;
  if (!_presetThumbCache[p.id]) _presetThumbCache[p.id] = p.gen();
  return _presetThumbCache[p.id];
}

const matAssignments = {};

async function applyPreset(materialIndex, preset) {
  const mv2 = document.getElementById('mv');
  const material = mv2.model.materials[materialIndex];
  const pbr = material.pbrMetallicRoughness;
  if (preset.type === 'color') {
    await pbr.setBaseColorFactor(preset.color);
    if (pbr.baseColorTexture?.texture) pbr.baseColorTexture.setTexture(null);
  } else {
    const dataUrl = presetThumb(preset);
    const texture = await mv2.createTexture(dataUrl);
    pbr.baseColorTexture.setTexture(texture);
    await pbr.setBaseColorFactor([1, 1, 1, 1]);
  }
  pbr.setRoughnessFactor(preset.roughness);
  pbr.setMetallicFactor(preset.metalness);
  matAssignments[materialIndex] = preset.id;
}

function renderPanel() {
  const mv2 = document.getElementById('mv');
  const materials = mv2.model.materials;
  const list = document.getElementById('mat-list');
  list.innerHTML = materials.map((m, i) => {
    const c = m.pbrMetallicRoughness.baseColorFactor;
    const swatchColor = `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
    return `
      <div class="mat-row">
        <div class="mat-name"><span class="mat-swatch" style="background:${swatchColor}"></span>${m.name || '(이름 없음)'}</div>
        <div class="preset-grid" data-mat="${i}">
          ${PRESETS.map(p => `<button class="preset-btn ${matAssignments[i]===p.id?'active':''}" title="${p.label}" data-mat="${i}" data-preset="${p.id}" style="background:${p.type==='color'?p.swatch:`url(${presetThumb(p)})`}"></button>`).join('')}
        </div>
      </div>`;
  }).join('');
  list.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const mi = parseInt(btn.dataset.mat);
      const preset = PRESETS.find(p => p.id === btn.dataset.preset);
      await applyPreset(mi, preset);
      renderPanel();
    });
  });
}

mv.addEventListener('load', () => { renderPanel(); });
</script>
</body>
</html>
