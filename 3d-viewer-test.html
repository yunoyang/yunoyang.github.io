<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 뷰어 테스트 — 정자동 우성아파트</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: #f5f5f7; }
  #topbar { padding: 12px 16px; background: #fff; border-bottom: 1px solid #eef0f5; font-size: 14px; font-weight: 700; color: #111; flex-shrink: 0; }
  #main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { position: relative; flex: 1; height: 100%; }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }
  #click-hint { position: absolute; top: 10px; left: 10px; background: rgba(17,17,17,0.75); color: #fff; font-size: 12px; padding: 7px 12px; border-radius: 999px; pointer-events: none; max-width: 70%; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #999; background: #eee; }
  #panel { width: 300px; height: 100%; overflow-y: auto; background: #fff; border-left: 1px solid #e5e5ec; padding: 14px; flex-shrink: 0; }
  #panel h3 { font-size: 13px; margin: 0 0 4px; color: #999; font-weight: 700; }
  #panel .hint { font-size: 12px; color: #bbb; margin-bottom: 14px; line-height: 1.5; }
  #selected-info { font-size: 13px; font-weight: 700; color: #111; padding: 10px 12px; background: #f7f8fa; border-radius: 10px; margin-bottom: 12px; min-height: 20px; }
  .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .preset-btn { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; background-size: cover; position: relative; }
  .preset-btn.active { border-color: #5084ff; }
  .preset-btn:hover { border-color: #aaa; }
  .preset-btn:disabled { opacity: .4; cursor: not-allowed; }
  .preset-label { font-size: 10px; text-align: center; color: #999; margin-top: 3px; }
  @media (max-width: 700px) {
    #main { flex-direction: column; }
    #panel { width: 100%; height: 42%; border-left: none; border-top: 1px solid #eef0f5; }
    #canvas-wrap { height: 58%; }
  }
</style>
</head>
<body>
<div id="topbar">3D 뷰어 테스트 — 정자동 우성아파트 (영역별 재질 편집)</div>
<div id="main">
  <div id="canvas-wrap">
    <div id="loading">모델 불러오는 중…</div>
    <div id="click-hint">모델을 클릭해서 바닥·벽·가구를 영역별로 선택하세요</div>
  </div>
  <div id="panel">
    <h3>재질 편집</h3>
    <div class="hint">영역을 클릭하면 그 부분만 독립적으로 재질을 바꿀 수 있어요</div>
    <div id="selected-info">영역을 먼저 선택해주세요</div>
    <div id="preset-panel"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const wrap = document.getElementById('canvas-wrap');

// ---- 씬 기본 설정 ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeeee);
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
wrap.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight2.position.set(-5, 5, -7);
scene.add(dirLight2);

window.addEventListener('resize', () => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---- 프리셋: canvas로 생성한 유사 재질 텍스처 ----
function makeTexture(draw) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  draw(ctx, c.width, c.height);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function woodTexture(base, dark, streaks) {
  return makeTexture((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < streaks; i++) {
      const x = (i / streaks) * w + (Math.random() - 0.5) * 10;
      ctx.strokeStyle = dark;
      ctx.globalAlpha = 0.15 + Math.random() * 0.2;
      ctx.lineWidth = 2 + Math.random() * 4;
      ctx.beginPath(); ctx.moveTo(x, 0);
      let cx = x;
      for (let y = 0; y <= h; y += 20) { cx += (Math.random() - 0.5) * 14; ctx.lineTo(cx, y); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
}
function plankFloorTexture(base, dark) {
  return makeTexture((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const plankH = 64;
    for (let y = 0; y < h; y += plankH) {
      const offset = (y / plankH) % 2 === 0 ? 0 : w / 2;
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      for (let x = -offset; x < w; x += w / 3) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + plankH); ctx.stroke();
      }
      for (let i = 0; i < 8; i++) {
        const gx = Math.random() * w, gy = y + Math.random() * plankH;
        ctx.strokeStyle = dark; ctx.globalAlpha = 0.12;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + w / 3, gy + (Math.random() - 0.5) * 6); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  });
}
function brushedMetalTexture() {
  return makeTexture((ctx, w, h) => {
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#b8bcc2'); grad.addColorStop(0.5, '#e8eaed'); grad.addColorStop(1, '#b0b4ba');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 2) {
      ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
  });
}
function stuccoTexture(base) {
  return makeTexture((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 20;
      img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
    }
    ctx.putImageData(img, 0, 0);
  });
}
function fabricTexture(base) {
  return makeTexture((ctx, w, h) => {
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    for (let x = 0; x < w; x += 4) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  });
}
function swatchDataUrl(hex) {
  const c = document.createElement('canvas'); c.width = c.height = 8;
  const ctx = c.getContext('2d'); ctx.fillStyle = hex; ctx.fillRect(0, 0, 8, 8);
  return c.toDataURL();
}
function textureThumbUrl(tex) { return tex.image.toDataURL(); }

const PRESETS = [
  { id: 'white',  label: '화이트 무광',    type: 'color', color: 0xf5f5f2, roughness: 0.9, metalness: 0.0 },
  { id: 'black',  label: '블랙 글로시',    type: 'color', color: 0x1a1a1a, roughness: 0.2, metalness: 0.1 },
  { id: 'grey',   label: '라이트 그레이',  type: 'color', color: 0xc9cad0, roughness: 0.8, metalness: 0.0 },
  { id: 'oak',    label: '연한 오크',      type: 'texture', gen: () => woodTexture('#e8d3ae', '#b8874f', 40), roughness: 0.7, metalness: 0.0 },
  { id: 'walnut', label: '월넛 다크우드',  type: 'texture', gen: () => woodTexture('#5a3a24', '#2c1a0f', 45), roughness: 0.6, metalness: 0.0 },
  { id: 'floor',  label: '오크 마루',      type: 'texture', gen: () => plankFloorTexture('#8a6440', '#4a3120'), roughness: 0.75, metalness: 0.0 },
  { id: 'steel',  label: '브러시드 스틸',  type: 'texture', gen: () => brushedMetalTexture(), roughness: 0.35, metalness: 0.85 },
  { id: 'stucco', label: '스타코/플라스터', type: 'texture', gen: () => stuccoTexture('#e9e7e2'), roughness: 0.95, metalness: 0.0 },
  { id: 'fabric', label: '패브릭',         type: 'texture', gen: () => fabricTexture('#d8d2c6'), roughness: 0.9, metalness: 0.0 },
];
const _presetTexCache = {};
function presetTexture(p) {
  if (!_presetTexCache[p.id]) _presetTexCache[p.id] = p.gen();
  return _presetTexCache[p.id];
}
const _presetThumbCache = {};
function presetThumb(p) {
  if (p.type === 'color') { if (!_presetThumbCache[p.id]) _presetThumbCache[p.id] = swatchDataUrl('#' + p.color.toString(16).padStart(6, '0')); return _presetThumbCache[p.id]; }
  if (!_presetThumbCache[p.id]) _presetThumbCache[p.id] = textureThumbUrl(presetTexture(p));
  return _presetThumbCache[p.id];
}

// ---- 모델 로드: 메시마다 재질을 독립 복제해서, 같은 SketchUp 재질을 공유하던
// 영역(예: 여러 방에 걸친 같은 바닥재)도 각각 따로 선택/편집 가능하게 함 ----
let selectedMeshes = [];      // 현재 선택된 메시들 (묶음 선택 시 여러 개)
let selectedGroupId = null;   // 현재 "묶음" 선택 기준이 된 최상위 그룹 id
let selectionMode = null;     // 'group' | 'single'
const meshAssignments = new Map(); // mesh.uuid -> presetId
const EDGE_COLOR_DEFAULT = 0x333333;
const EDGE_COLOR_SELECTED = 0x5084ff;
const groupMap = new Map(); // outermost group id -> mesh[]

// 메시 이름(예: "Mesh120_Group82_Group81_Group79_Model")에 스케치업의 중첩 그룹/컴포넌트
// 체인이 그대로 남아있음 — 뒤에서부터가 바깥쪽(최상위) 그룹. 이를 이용해 "싱크대 세트" 같은
// 묶음 전체를 한번에 선택할 수 있게 함.
function outermostGroupId(mesh) {
  const tokens = mesh.name.match(/Group\d+/g);
  if (!tokens || !tokens.length) return mesh.name; // 그룹 정보 없으면 자기 자신이 곧 그룹
  return tokens[tokens.length - 1];
}

const loader = new THREE.GLTFLoader();
loader.load('assets/models/jeongja-woosung.glb', (gltf) => {
  const model = gltf.scene;
  // 원본 메시 목록을 먼저 스냅샷 — traverse 도중 obj.add()로 자식(엣지·오버레이)을 추가하면
  // 그 자식도 traverse 대상에 걸려 무한 재귀(오버레이 안에 오버레이…)로 스택오버플로우가 났음
  const meshes = [];
  model.traverse((obj) => { if (obj.isMesh) meshes.push(obj); });
  meshes.forEach((obj) => {
    {
      obj.material = obj.material.clone();
      obj.material.side = THREE.DoubleSide;

      // 스케치업처럼 모든 메시 가장자리에 스트로크(엣지) 표시 — 영역 구분을 명확하게
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(obj.geometry, 20),
        new THREE.LineBasicMaterial({ color: EDGE_COLOR_DEFAULT })
      );
      edges.raycast = () => {}; // 클릭 판정에서 제외 (원본 메시만 클릭되게)
      obj.add(edges);
      obj.userData.edges = edges;

      // 선택 시 표시할 반투명 블루 오버레이 (기본은 숨김)
      const overlay = new THREE.Mesh(obj.geometry, new THREE.MeshBasicMaterial({
        color: EDGE_COLOR_SELECTED, transparent: true, opacity: 0.35,
        side: THREE.DoubleSide, depthTest: true, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
      }));
      overlay.visible = false;
      overlay.raycast = () => {}; // 클릭 판정에서 제외
      obj.add(overlay);
      obj.userData.overlay = overlay;

      const gid = outermostGroupId(obj);
      if (!groupMap.has(gid)) groupMap.set(gid, []);
      groupMap.get(gid).push(obj);
    }
  });
  scene.add(model);

  // 카메라를 모델 크기에 맞게 배치
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.near = maxDim / 1000;
  camera.far = maxDim * 10;
  camera.updateProjectionMatrix();
  camera.position.set(center.x + maxDim * 0.9, center.y + maxDim * 0.7, center.z + maxDim * 0.9);
  controls.target.copy(center);
  controls.minDistance = maxDim * 0.05;
  controls.maxDistance = maxDim * 5;
  controls.update();

  document.getElementById('loading').style.display = 'none';
});

// ---- 클릭으로 개별 영역(메시) 선택 ----
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// 선택된 메시들: 엣지를 블루로, 면에 반투명 블루 오버레이 표시. 이전 선택은 원상복구.
function setSelectionHighlight(meshes) {
  selectedMeshes.forEach((m) => {
    if (m.userData.edges) {
      m.userData.edges.material.color.setHex(EDGE_COLOR_DEFAULT);
      m.userData.overlay.visible = false;
    }
  });
  meshes.forEach((m) => {
    if (m.userData.edges) {
      m.userData.edges.material.color.setHex(EDGE_COLOR_SELECTED);
      m.userData.overlay.visible = true;
    }
  });
}

// 같은 묶음(그룹)이 이미 선택된 상태에서 그 안의 한 부분을 다시 클릭하면 그 부분만 선택,
// 그 외의 경우(새 묶음을 처음 클릭)에는 묶음 전체를 선택
function selectFromClick(mesh) {
  const gid = outermostGroupId(mesh);
  const groupMeshes = groupMap.get(gid) || [mesh];
  const isDrillDown = selectionMode === 'group' && selectedGroupId === gid && groupMeshes.length > 1;

  let meshes, mode;
  if (isDrillDown) {
    meshes = [mesh];
    mode = 'single';
  } else {
    meshes = groupMeshes;
    mode = groupMeshes.length > 1 ? 'group' : 'single';
  }

  setSelectionHighlight(meshes);
  selectedMeshes = meshes;
  selectedGroupId = gid;
  selectionMode = mode;

  const label = mode === 'group'
    ? `선택됨: 묶음 (${meshes.length}개 부분) — 안의 특정 부분을 다시 클릭하면 그 부분만 선택돼요`
    : `선택됨: ${mesh.name || '(이름 없음)'}`;
  document.getElementById('click-hint').textContent = label;
  document.getElementById('selected-info').textContent = mode === 'group'
    ? `묶음 선택 (${meshes.length}개 부분)`
    : (mesh.name || '(이름 없음)');
  renderPresetPanel();
}

renderer.domElement.addEventListener('click', (ev) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(scene.children, true).filter(i => i.object.isMesh);
  if (!intersects.length) return;
  selectFromClick(intersects[0].object);
});

function applyPresetToSelected(preset) {
  if (!selectedMeshes.length) return;
  selectedMeshes.forEach((mesh) => {
    const mat = mesh.material;
    if (preset.type === 'color') {
      mat.color.setHex(preset.color);
      mat.map = null;
    } else {
      mat.map = presetTexture(preset);
      mat.color.setHex(0xffffff);
    }
    mat.roughness = preset.roughness;
    mat.metalness = preset.metalness;
    mat.needsUpdate = true;
    meshAssignments.set(mesh.uuid, preset.id);
  });
  renderPresetPanel();
}

function renderPresetPanel() {
  const el = document.getElementById('preset-panel');
  if (!selectedMeshes.length) { el.innerHTML = ''; return; }
  // 묶음 안 부분들의 재질이 서로 다르면 활성 표시는 생략 (여러 값이라 하나로 못 정함)
  const ids = new Set(selectedMeshes.map(m => meshAssignments.get(m.uuid)));
  const activeId = ids.size === 1 ? [...ids][0] : null;
  el.innerHTML = `<div class="preset-grid">${PRESETS.map(p => `
    <div>
      <button class="preset-btn ${activeId===p.id?'active':''}" data-preset="${p.id}" style="background-image:url(${presetThumb(p)})"></button>
      <div class="preset-label">${p.label}</div>
    </div>
  `).join('')}</div>`;
  el.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const preset = PRESETS.find(p => p.id === btn.dataset.preset);
      applyPresetToSelected(preset);
    });
  });
}
</script>
</body>
</html>
