<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>YouTube</title>
<!-- iOS 앱(capacitor://)에서는 Referer가 없어 유튜브 임베드가 '오류 153'으로 막힘 → https 도메인의 이 페이지를 거쳐 재생 -->
<style>html,body{margin:0;height:100%;background:#000}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
const id = (new URLSearchParams(location.search).get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
if (id) {
  const f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0';
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.allowFullscreen = true;
  document.body.appendChild(f);
}
</script>
</body>
</html>
